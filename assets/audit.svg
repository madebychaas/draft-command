<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#160f08"/><stop offset=".45" stop-color="#09070f"/><stop offset="1" stop-color="#28113f"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#f2d37b"/><stop offset="1" stop-color="#ffc62f"/></linearGradient>
