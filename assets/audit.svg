<text x="1508" y="685" text-anchor="end" class="caps" fill="#4fe0a1" font-size="15">CONFIRMED → FIXED</text>
<text x="594" y="726" class="sans muted" font-size="20">A fresh fetch could make stale</text><text x="594" y="753" class="sans muted" font-size="20">upstream data appear current.</text>
