    .muted{fill:#aaa3b6}
    .text{fill:#f6f2ea}
    .purple{fill:#9055d6}
    .gold{fill:#ffc62f}
    .green{fill:#4fe0a1}
    .amber{fill:#f4b860}
    .red{fill:#ff6b6b}
  </style>
</defs>
