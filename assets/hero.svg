<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#160f08"/><stop offset=".45" stop-color="#09070f"/><stop offset="1" stop-color="#28113f"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#f2d37b"/><stop offset="1" stop-color="#ffc62f"/></linearGradient>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}
    .cond{font-family:"Arial Narrow",Arial,Helvetica,sans-serif;font-stretch:condensed}
    .caps{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:2px}
    .muted{fill:#aaa3b6}
    .text{fill:#f6f2ea}
    .purple{fill:#9055d6}
    .gold{fill:#ffc62f}
    .green{fill:#4fe0a1}
    .amber{fill:#f4b860}
    .red{fill:#ff6b6b}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="60" y="44" width="54" height="54" rx="14" fill="#0c0914" stroke="#7c4fb1" stroke-width="2"/>
<rect x="72" y="60" width="22" height="24" rx="5" fill="none" stroke="#ffc62f" stroke-width="3"/>
<rect x="85" y="63" width="22" height="24" rx="5" fill="none" stroke="#9055d6" stroke-width="3"/>
<text x="130" y="79" class="caps text" font-size="22">DRAFT</text>
<text x="214" y="79" class="caps gold" font-size="22">COMMAND</text>


<text x="76" y="195" class="caps purple" font-size="20">REAL-TIME ADVERSARIAL DECISION INTELLIGENCE</text>
<text x="72" y="290" class="cond text" font-size="70" font-weight="800">ONE DECISION.</text>
<text x="72" y="362" class="cond" fill="#f2d37b" font-size="66" font-weight="800">ALL THE</text>
<text x="72" y="434" class="cond" fill="#f2d37b" font-size="66" font-weight="800">INTELLIGENCE</text>
<text x="72" y="506" class="cond text" font-size="70" font-weight="800">BEHIND IT.</text>
<text x="76" y="570" class="sans muted" font-size="23">A predictive decision system for sequential choice</text>
<text x="76" y="602" class="sans muted" font-size="23">under uncertainty.</text>

<!-- proof badges -->
<g>
  <rect x="72" y="660" width="160" height="118" rx="18" fill="#100c1a" stroke="#49395d"/>
  <text x="90" y="709" class="cond gold" font-size="28" font-weight="800">60</text>
  <text x="90" y="750" class="caps muted" font-size="13">SEC CLOCK</text>
  <rect x="248" y="660" width="160" height="118" rx="18" fill="#100c1a" stroke="#49395d"/>
  <text x="266" y="709" class="cond gold" font-size="28" font-weight="800">1,000</text>
  <text x="266" y="750" class="caps muted" font-size="13">SIMS / REGIME</text>
  <rect x="424" y="660" width="160" height="118" rx="18" fill="#100c1a" stroke="#49395d"/>
  <text x="442" y="709" class="cond green" font-size="28" font-weight="800">75 / 75</text>
  <text x="442" y="750" class="caps muted" font-size="13">TESTS PASSING</text>
  <rect x="600" y="660" width="160" height="118" rx="18" fill="#100c1a" stroke="#49395d"/>
  <text x="618" y="707" class="cond green" font-size="20" font-weight="800">FAIL CLOSED</text>
  <text x="618" y="750" class="caps muted" font-size="13">TRUST GATE</text>
</g>

<!-- product inset -->
<rect x="760" y="120" width="770" height="650" rx="28" fill="#0b0813" stroke="#7e4ab9" stroke-width="2"/>
<text x="794" y="172" class="caps text" font-size="20">DRAFT COMMAND</text>
<text x="1010" y="172" class="caps purple" font-size="18">PLANNING</text>
<circle cx="1450" cy="165" r="6" fill="#4fe0a1"/><text x="1465" y="172" class="caps green" font-size="15">LIVE</text>
<rect x="794" y="208" width="216" height="452" rx="22" fill="#120d1e" stroke="#352848"/>
<text x="902" y="260" text-anchor="middle" class="caps muted" font-size="17">NEXT PICK</text>
<text x="902" y="365" text-anchor="middle" class="cond text" font-size="76" font-weight="800">2.08</text>
<g stroke="#3d2756" fill="none"><circle cx="902" cy="490" r="98"/><circle cx="902" cy="490" r="66"/><circle cx="902" cy="490" r="36"/><line x1="792" y1="490" x2="1012" y2="490"/><line x1="902" y1="380" x2="902" y2="600"/></g>
<circle cx="902" cy="490" r="7" fill="#9055d6"/>

