  <line x1="1058" y1="292" x2="1462" y2="292" stroke="#2d2639" stroke-width="6"/><line x1="1058" y1="292" x2="1390" y2="292" stroke="#4fe0a1" stroke-width="6"/>
  <rect x="1034" y="320" width="462" height="96" rx="18" fill="#120d1e" stroke="#362a48"/>
  <text x="1058" y="350" class="caps purple" font-size="14">BACKUP 1</text><text x="1058" y="392" class="sans text" font-size="27" font-weight="700">Saquon Barkley</text><text x="1472" y="378" text-anchor="end" class="caps green" font-size="13">READY</text>
  <line x1="1058" y1="404" x2="1462" y2="404" stroke="#2d2639" stroke-width="6"/><line x1="1058" y1="404" x2="1325" y2="404" stroke="#4fe0a1" stroke-width="6"/>
  <rect x="1034" y="432" width="462" height="96" rx="18" fill="#120d1e" stroke="#362a48"/>
  <text x="1058" y="462" class="caps purple" font-size="14">BACKUP 2</text><text x="1058" y="504" class="sans text" font-size="27" font-weight="700">Ashton Jeanty</text><text x="1472" y="490" text-anchor="end" class="caps green" font-size="13">READY</text>
  <line x1="1058" y1="516" x2="1462" y2="516" stroke="#2d2639" stroke-width="6"/><line x1="1058" y1="516" x2="1252" y2="516" stroke="#4fe0a1" stroke-width="6"/>
  <rect x="1034" y="544" width="462" height="96" rx="18" fill="#120d1e" stroke="#362a48"/>
  <text x="1058" y="574" class="caps purple" font-size="14">DREAM FALL</text><text x="1058" y="616" class="sans text" font-size="27" font-weight="700">Jahmyr Gibbs</text><text x="1472" y="602" text-anchor="end" class="caps amber" font-size="13">LOW SURVIVAL</text>
  <line x1="1058" y1="628" x2="1462" y2="628" stroke="#2d2639" stroke-width="6"/><line x1="1058" y1="628" x2="1123" y2="628" stroke="#f4b860" stroke-width="6"/>
</g>
<rect x="1034" y="668" width="462" height="66" rx="16" fill="#0f0b19" stroke="#372b48"/>
<circle cx="1062" cy="701" r="6" fill="#4fe0a1"/><text x="1077" y="708" class="caps green" font-size="15">READY</text><text x="1160" y="708" class="sans muted" font-size="18">All required inputs fresh</text>
</svg>